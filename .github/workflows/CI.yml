# References
# - https://enu23456.hatenablog.com/entry/2022/11/24/195744
name: CI
run-name: ${{ github.workflow }} (${{ github.ref_name }})

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # GitHub の仕様上、on.push / on.pull_request の paths フィルタで workflow
  # ごとスキップされると、そのチェックは "Pending" のまま残ってしまい、
  # required status check に設定していると PR がマージできなくなる。
  # 一方、job が if 条件でスキップされた場合は "Success" として報告されるため、
  # required にしても安全。そのため paths フィルタは on: から外し、ここで
  # dorny/paths-filter を使って後続 job の if 条件として判定する。
  changes:
    runs-on: ubuntu-latest
    # paths-filter は pull_request のとき GitHub REST API で差分を取るので
    # pull-requests: read が要る。workflow レベルで contents: read しか
    # 与えていない (= 他は none) ため、ここで job レベルに補う。
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # push のときは git の履歴を辿って差分を取るため、浅いクローンだと
      # 比較対象のコミットが手元に無くて失敗しうる。リポジトリが小さいので
      # 全部取ってしまうのが確実。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # workflow_dispatch には「比較対象」が存在しないため paths-filter は
      # 正しく判定できない。手動実行はそもそも「今すぐ全部回したい」ときに
      # 使うものなので、判定自体を飛ばして下の job を必ず走らせる。
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'example/example_chache.csv'
              - 'pyproject.toml'
              - 'ruff.toml'
              - 'mypy.ini'
              - 'MANIFEST.in'
              - '.github/workflows/CI.yml'

  test:
    needs: changes
    # 手動実行時は filter を飛ばしていて outputs.code が空になるので、
    # workflow_dispatch を明示的に拾う。
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # golden テストを含めて 1 ジョブ 10 分以内に収める。
    timeout-minutes: 10
    strategy:
      # golden が一致するかは Python ごとに確かめたいので、
      # 1 つのセルが落ちても残りのセルは最後まで走らせる。
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip install ".[test]"
    # testpaths と警告の扱いは pyproject.toml の [tool.pytest.ini_options]。
    - name: Test with pytest
      run: |
        pytest

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        pip install ".[dev]"
    - name: Build sdist and wheel
      run: |
        python -m build
    # wheel には example/ と tests/ を入れず、py.typed は入れる。
    - name: Check wheel contents
      run: |
        shopt -s nullglob
        wheels=(dist/*.whl)
        if [ "${#wheels[@]}" -ne 1 ]; then
          echo "::error::expected exactly one wheel in dist/, found ${#wheels[@]}"
          exit 1
        fi
        python -m zipfile -l "${wheels[0]}"
        python - "${wheels[0]}" <<'EOF'
        import sys
        import zipfile

        with zipfile.ZipFile(sys.argv[1]) as wheel:
            names = wheel.namelist()
        problems = [
            f"wheel must not contain {name}"
            for name in names
            if name.startswith(("example/", "tests/"))
        ]
        if "ensemble_outlier_sample_detection/py.typed" not in names:
            problems.append(
                "wheel is missing ensemble_outlier_sample_detection/py.typed"
            )
        for problem in problems:
            print(f"::error::{problem}")
        sys.exit(1 if problems else 0)
        EOF
