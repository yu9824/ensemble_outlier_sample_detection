# 2021-era runtime used to generate the `legacy` golden block.
#
# Platform: osx-arm64 only. Every package is pinned as name=version=build,
# so the build strings below do not resolve on other platforms.
# Created: 2026-10-19 from the runtime dependency closure of python, numpy,
# scipy, scikit-learn, pandas, optuna and tqdm in a working local env
# (conda-forge builds that were still installable at that date).
#
#   mamba env create -f tests/golden/environment-legacy.yml
#
# The expected versions are duplicated as constants in generate_golden.py;
# keep both in sync when this file changes.
name: eosd-golden-legacy
channels:
  - conda-forge
dependencies:
  # Primary runtime (checked by generate_golden.py --env legacy)
  - python=3.8.20=h7d35d02_2_cpython
  - numpy=1.20.1=py38h9e6c65a_0
  - scipy=1.6.2=py38hd0c9ec0_0
  - scikit-learn=0.24.1=py38h397cc00_0
  - pandas=1.2.4=py38h3777fb4_0
  - optuna=2.8.0=pyhd8ed1ab_0
  - tqdm=4.59.0=pyhd8ed1ab_0
  # BLAS / LAPACK and native runtime libraries
  - _openmp_mutex=4.5=8_kmp_llvm
  - libblas=3.9.0=20_osxarm64_openblas
  - libcblas=3.9.0=20_osxarm64_openblas
  - liblapack=3.9.0=20_osxarm64_openblas
  - libopenblas=0.3.25=openmp_h6c19121_0
  - libcxx=23.1.2=h55c6f16_0
  - libgcc=16.2.0=h3cf6597_7
  - libgfortran=16.2.0=h07b0088_7
